<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f2eb"><title>The Mailer — your calmer inbox</title>
<style>
:root{color-scheme:light;--bg:#f6f2eb;--surface:#fffdf9;--surface2:#f0eae0;--ink:#252c3b;--muted:#777d88;--line:#e7e1d7;--accent:#5965ce;--accent2:#e8e9ff;--green:#31795f;--shadow:0 12px 40px #2c26300d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{color:inherit;border:0;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #969cf4;outline-offset:2px}.shell{min-height:100vh;max-width:1600px;margin:auto;padding:20px;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:66px minmax(0,1fr);gap:16px}.top{grid-column:1/-1;display:flex;align-items:center;gap:24px;padding:0 8px}.brand{display:flex;align-items:center;gap:11px;width:204px;font-size:21px;font-weight:750;letter-spacing:-.7px}.logo{width:37px;height:37px;border-radius:13px;background:var(--accent);color:white;display:grid;place-items:center;font-size:19px;box-shadow:0 5px 12px #5965ce40}.tagline{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);display:block}.search-wrap{height:46px;max-width:690px;flex:1;display:flex;align-items:center;gap:9px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}.search-wrap input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink)}.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center}.btn-icon{width:40px;height:40px;border-radius:12px;background:transparent;display:grid;place-items:center;font-size:17px}.btn-icon:hover,.small-btn:hover{background:var(--surface2)}.user-chip{border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:5px 12px 5px 5px;display:flex;align-items:center;gap:8px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#d17a5d;font-weight:700;font-size:13px}.sidebar{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:calc(100vh - 122px)}.compose{width:100%;height:48px;background:var(--accent);color:white;border-radius:14px;font-weight:700;box-shadow:0 7px 14px #5965ce33;margin-bottom:18px}.compose:hover{filter:brightness(.94)}.nav{display:grid;gap:4px}.nav-item{width:100%;height:41px;padding:0 12px;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border-radius:12px;color:#535b69}.nav-item:hover{background:var(--surface2)}.nav-item.active{color:var(--accent);background:var(--accent2);font-weight:700}.nav-icon{width:21px;text-align:center;font-size:17px}.nav-count{margin-left:auto;font-size:12px}.nav-heading{margin:23px 10px 8px;color:var(--muted);font-size:10px;letter-spacing:1.1px;font-weight:750;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}.add-label{font-size:18px;color:var(--muted);border-radius:7px;width:25px;height:25px}.label-list{display:grid;gap:3px}.label-link{height:34px;width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:none;border-radius:10px;padding:0 12px;color:#59606d}.label-color{width:9px;height:9px;border-radius:50%;background:#df9566}.storage-card{margin-top:auto;background:#f7f4ff;padding:13px;border-radius:14px;font-size:12px;color:#555b70}.storage-card strong{display:block;color:var(--ink);margin-bottom:4px}.main{min-width:0;min-height:calc(100vh - 122px);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}.main-head{min-height:73px;padding:18px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.main-head h1{font-size:22px;letter-spacing:-.5px;margin:0}.head-sub{font-size:12px;color:var(--muted);margin-left:2px}.head-spacer{flex:1}.small-btn{width:36px;height:36px;border-radius:10px;background:transparent;display:grid;place-items:center;font-size:16px}.toolbar{height:52px;padding:0 18px;display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--line);color:var(--muted)}.toolbar .divider{height:20px;width:1px;background:var(--line);margin:0 6px}.selected-count{font-size:12px;margin-left:8px}.mail-list{padding:9px 14px;overflow:auto}.mail-card{min-height:76px;border:1px solid transparent;border-bottom-color:var(--line);padding:10px 8px;display:grid;grid-template-columns:27px 28px 42px minmax(120px,190px) minmax(0,1fr) 75px;align-items:center;gap:8px;border-radius:12px;transition:background .15s}.mail-card:hover{background:#f9f7f2;border-color:#eee8dc}.mail-card.unread{background:#fbfaff}.mail-card.unread .mail-sender,.mail-card.unread .mail-subject{font-weight:750;color:#292e40}.mail-check{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}.star-btn{background:transparent;color:#b9b8b2;font-size:19px}.star-btn.on{color:#e2a53c}.person{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:750;font-size:13px}.mail-sender,.mail-subject{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mail-sender{font-size:13px}.mail-subject{font-size:13px;cursor:pointer}.mail-preview{color:var(--muted);font-weight:400}.mail-date{text-align:right;font-size:11px;color:var(--muted);white-space:nowrap}.empty{margin:auto;text-align:center;max-width:360px;padding:55px 20px;color:var(--muted)}.empty-emoji{font-size:43px;margin-bottom:14px}.empty h2{color:var(--ink);font-size:19px;margin:0 0 5px}.reader{padding:25px 34px;overflow:auto}.reader-top{display:flex;gap:8px;margin-bottom:23px}.reader h2{font-size:26px;letter-spacing:-.7px;margin:0 0 22px}.reader-meta{display:flex;align-items:center;gap:12px;margin-bottom:22px}.reader-meta strong{font-size:14px}.reader-meta small{display:block;color:var(--muted)}.reader-content{white-space:pre-wrap;line-height:1.8;min-height:100px;margin-left:52px}.reader-actions{margin:32px 0 0 52px;display:flex;gap:10px}.pill{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 15px}.pill:hover{background:var(--surface2)}.composer{position:fixed;z-index:5;right:35px;bottom:20px;width:min(540px,calc(100vw - 28px));height:min(640px,calc(100vh - 40px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 70px #17182733;display:none;flex-direction:column;overflow:hidden}.composer.open{display:flex}.compose-head{height:49px;display:flex;align-items:center;padding:0 15px;background:#f1effb;font-weight:700}.compose-head button{margin-left:auto}.compose-fields input{height:45px;padding:0 16px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;outline:0}.compose-body{flex:1;min-height:100px;border:0;padding:16px;resize:none;background:transparent;outline:0;line-height:1.6}.compose-attachments{padding:0 15px;color:var(--muted);font-size:12px}.compose-footer{height:63px;display:flex;align-items:center;gap:7px;padding:0 13px}.send-btn{border-radius:11px;background:var(--accent);color:white;font-weight:700;padding:10px 22px}.send-btn:hover{filter:brightness(.93)}.compose-tools{display:flex;gap:2px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);padding:12px 18px;background:#252c3b;color:white;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:10;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-backdrop{position:fixed;inset:0;background:#17182766;display:grid;place-items:center;padding:18px;z-index:8}.modal{width:min(440px,100%);background:var(--surface);border-radius:18px;padding:22px;box-shadow:0 18px 60px #0003}.modal h2{margin:0 0 12px;font-size:20px}.modal p{color:var(--muted);line-height:1.6}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.modal input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}.dark{color-scheme:dark;--bg:#171923;--surface:#222531;--surface2:#303342;--ink:#f2f1f7;--muted:#adb0bf;--line:#383b49;--accent:#9299ff;--accent2:#343650;--green:#83c9a9;--shadow:0 12px 40px #0002}.dark .storage-card,.dark .compose-head{background:#303147}.dark .mail-card.unread{background:#282838}.dark .search-wrap{background:var(--surface)}
@media(max-width:850px){.shell{grid-template-columns:68px minmax(0,1fr);padding:12px;gap:10px}.brand{width:68px}.brand-copy,.nav-text,.nav-count,.nav-heading,.label-list,.storage-card,.compose-label{display:none!important}.sidebar{padding:12px 8px;align-items:center}.compose{width:46px;font-size:20px}.nav{width:100%}.nav-item{justify-content:center;padding:0}.nav-icon{width:auto}.main,.sidebar{min-height:calc(100vh - 90px)}.top{gap:10px}.mail-card{grid-template-columns:24px 24px 38px minmax(0,1fr) 65px}.mail-sender{display:none}}
@media(max-width:580px){.shell{display:flex;flex-direction:column;padding:8px;gap:8px}.top{height:auto;min-height:52px;flex-wrap:wrap;padding:2px}.brand{width:auto;flex:1}.brand-copy{display:block!important}.tagline{display:none}.top-actions{margin:0}.user-chip{padding:3px}.user-name{display:none}.search-wrap{order:3;flex:1 0 100%;max-width:none;height:42px}.sidebar{min-height:0;padding:6px;display:block;overflow:auto}.compose{display:none}.nav{display:flex;gap:4px}.nav-item{min-width:46px;height:40px}.main{min-height:calc(100vh - 150px);border-radius:16px}.main-head{padding:14px}.main-head h1{font-size:20px}.head-sub{display:none}.mail-list{padding:6px}.mail-card{grid-template-columns:22px 22px minmax(0,1fr) 58px;gap:5px;padding:8px 4px;min-height:69px}.mail-card .person{display:none}.mail-sender{display:block;grid-column:3;grid-row:1;font-size:12px}.mail-subject{grid-column:3;grid-row:2;font-size:12px}.mail-date{grid-column:4;grid-row:1/3;font-size:10px}.reader{padding:18px}.reader-content,.reader-actions{margin-left:0}.toolbar{padding:0 8px}.composer{right:10px;bottom:10px;height:min(620px,calc(100vh - 20px))}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <div class="brand"><div class="logo">✉</div><div class="brand-copy">The Mailer<span class="tagline">A calmer inbox</span></div></div>
  <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search messages…" aria-label="Search messages"><button class="small-btn" id="clearSearch" title="Clear search" aria-label="Clear search">×</button></label>
  <div class="top-actions"><button class="btn-icon" id="helpBtn" title="Help" aria-label="Help">?</button><button class="btn-icon" id="themeBtn" title="Toggle theme" aria-label="Toggle dark mode">◐</button><button class="user-chip" id="accountBtn" title="Account"><span class="avatar">U</span><span class="user-name">You⌄</span></button></div>
</header>
<aside class="sidebar">
  <button class="compose" id="composeBtn" title="Compose a message">＋ <span class="compose-label">Compose</span></button>
  <nav class="nav" aria-label="Mail folders">
    <button class="nav-item active" data-folder="Inbox"><span class="nav-icon">▣</span><span class="nav-text">Inbox</span><span class="nav-count" id="unreadCount"></span></button>
    <button class="nav-item" data-folder="Starred"><span class="nav-icon">☆</span><span class="nav-text">Starred</span></button>
    <button class="nav-item" data-folder="Snoozed"><span class="nav-icon">◷</span><span class="nav-text">Snoozed</span></button>
    <button class="nav-item" data-folder="Sent"><span class="nav-icon">↗</span><span class="nav-text">Sent</span></button>
    <button class="nav-item" data-folder="Archive"><span class="nav-icon">▤</span><span class="nav-text">Archive</span></button>
    <button class="nav-item" data-folder="Spam"><span class="nav-icon">!</span><span class="nav-text">Spam</span></button>
    <button class="nav-item" data-folder="Trash"><span class="nav-icon">♲</span><span class="nav-text">Trash</span></button>
    <button class="nav-item" data-folder="Drafts"><span class="nav-icon">▱</span><span class="nav-text">Drafts</span><span class="nav-count" id="draftCount"></span></button>
  </nav>
  <div class="nav-heading">Your labels <button class="add-label" id="addLabel" title="Create label" aria-label="Create label">＋</button></div><div id="labels" class="label-list"></div>
  <div class="storage-card"><strong>Private by design</strong>Your mailbox stays in this browser. No account or tracking.</div>
</aside>
<main class="main">
  <div class="main-head"><div><h1 id="folderTitle">Inbox</h1><div id="folderSubtitle" class="head-sub">Your messages, at a glance.</div></div><div class="head-spacer"></div><button class="small-btn" id="refreshBtn" title="Refresh messages" aria-label="Refresh">↻</button><button class="small-btn" id="sortBtn" title="Change sort order" aria-label="Sort messages">↕</button></div>
  <div class="toolbar" id="toolbar"><input type="checkbox" class="mail-check" id="selectAll" aria-label="Select all visible messages"><button class="small-btn" data-bulk="read" title="Mark read or unread" aria-label="Mark read or unread">●</button><button class="small-btn" data-bulk="archive" title="Archive selected" aria-label="Archive selected">▤</button><button class="small-btn" data-bulk="trash" title="Move selected to trash" aria-label="Delete selected">♲</button><button class="small-btn" data-bulk="spam" title="Report selected as spam" aria-label="Report spam">!</button><span class="divider"></span><button class="small-btn" data-bulk="label" title="Label selected" aria-label="Label selected">⌑</button><button class="small-btn" data-bulk="snooze" title="Snooze selected" aria-label="Snooze selected">◷</button><span class="selected-count" id="selectedCount"></span></div>
  <div class="mail-list" id="mailList" aria-live="polite"></div><section id="reader" class="reader" hidden></section>
</main>
</div>
<div class="composer" id="composer" role="dialog" aria-label="Compose message" aria-modal="true"><div class="compose-head">New message <button class="small-btn" id="closeCompose" title="Save draft and close" aria-label="Close">×</button></div><div class="compose-fields"><input id="toField" placeholder="To (email address)" aria-label="Recipient email address"><input id="subjectField" placeholder="Subject" aria-label="Subject"></div><textarea class="compose-body" id="bodyField" placeholder="Write your message…" aria-label="Message body"></textarea><div id="attachmentNames" class="compose-attachments"></div><div class="compose-footer"><button class="send-btn" id="sendBtn">Send</button><div class="compose-tools"><button class="small-btn" id="attachBtn" title="Attach files" aria-label="Attach files">📎</button><button class="small-btn" id="emojiBtn" title="Insert a smile" aria-label="Insert smile">☺</button></div><input id="fileInput" type="file" multiple hidden><span class="head-spacer"></span><button class="small-btn" id="discardBtn" title="Discard draft" aria-label="Discard draft">♲</button></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div id="modalRoot"></div>
<script>
(()=>{'use strict';
const KEY='the-mailer-mailbox-v2', PREF='the-mailer-preferences-v1';
const seed=[
{id:'m1',sender:'Ava Thompson',email:'ava@example.com',subject:'A little progress to celebrate',preview:'We wrapped the first milestone today. Sharing a few notes and what comes next.',body:'Hi there,\n\nWe wrapped the first milestone today, and the team is feeling great about the progress. I’ve put the notes and next steps together so everything is in one place.\n\nWould love your thoughts when you have a moment.\n\nWarmly,\nAva',time:Date.now()-1000*60*32,unread:true,starred:false,folder:'inbox',labels:[]},
{id:'m2',sender:'Milo at Fieldnotes',email:'milo@fieldnotes.example',subject:'Your Sunday reading list',preview:'Five thoughtful links for a slower morning, picked just for you.',body:'Good morning!\n\nThis week’s reading list is ready. Settle in with five thoughtful links and a cup of something warm.\n\nEnjoy the read,\nMilo',time:Date.now()-1000*60*60*3,unread:true,starred:true,folder:'inbox',labels:['Updates']},
{id:'m3',sender:'Studio North',email:'hello@studionorth.example',subject:'Re: Brand direction — round two',preview:'The softer palette feels right. I added two options to the deck.',body:'Thanks for the thoughtful feedback. The softer palette is feeling right to us too. I added two options to the deck—one with a little more warmth, and one that keeps things crisp.\n\nLet me know which direction you prefer.',time:Date.now()-1000*60*60*21,unread:false,starred:false,folder:'inbox',labels:['Work']},
{id:'m4',sender:'Rosa Martinez',email:'rosa@example.com',subject:'Dinner on Friday?',preview:'Found a cozy new place near the river. Are you around?',body:'Hey!\n\nFound a cozy new place near the river and thought it could be fun to try it Friday. Are you around?\n\nRosa',time:Date.now()-1000*60*60*30,unread:false,starred:true,folder:'inbox',labels:['Personal']},
{id:'m5',sender:'The Garden Club',email:'hello@gardenclub.example',subject:'A quick guide to spring herbs',preview:'Basil, mint, and rosemary: a few easy ways to get started.',body:'A little green goes a long way. Here are our favorite beginner-friendly herbs and tips for keeping them happy indoors.\n\nBasil loves a sunny window. Mint likes a bit more water. Rosemary prefers to dry out between drinks. Happy planting!',time:Date.now()-1000*60*60*55,unread:false,starred:false,folder:'archive',labels:['Updates']},
{id:'m6',sender:'You',email:'you@themailer.local',subject:'Notes for Monday',preview:'Remember to share the weekly plan with the team.',body:'Remember to share the weekly plan with the team.',time:Date.now()-1000*60*60*70,unread:false,starred:false,folder:'sent',to:'team@example.com',labels:[]}
];
let messages=loadMessages(), labels=loadPrefs().labels||['Personal','Work','Updates'], dark=!!loadPrefs().dark, currentFolder='Inbox', activeLabel='', query='', selected=new Set(), openedId=null, sortNewest=true, editingDraft=null, saveTimer;
const $=s=>document.querySelector(s), list=$('#mailList'), reader=$('#reader'), composer=$('#composer');
if(dark)document.body.classList.add('dark');
function loadMessages(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:seed}catch{return seed}}
function loadPrefs(){try{return JSON.parse(localStorage.getItem(PREF))||{}}catch{return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(messages));localStorage.setItem(PREF,JSON.stringify({labels,dark}))}catch{toast('Storage is full. Remove large attachments or clear old mail.') }}
function id(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2500)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(name='?'){return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function color(name=''){let n=0;for(const c of name)n=(n*31+c.charCodeAt(0))|0;return ['#cc795f','#6478b8','#548d79','#ba8d43','#9469a8','#488c9c'][Math.abs(n)%6]}
function dateLabel(t){const d=new Date(t),now=new Date();if(d.toDateString()===now.toDateString())return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});if((now-d)<86400000*6)return d.toLocaleDateString([],{weekday:'short'});return d.toLocaleDateString([],{month:'short',day:'numeric'})}
function visibleMessages(){let arr=messages.filter(m=>{if(query&&!`${m.sender} ${m.email} ${m.subject} ${m.preview} ${m.body} ${(m.labels||[]).join(' ')}`.toLowerCase().includes(query.toLowerCase()))return false;if(activeLabel)return (m.labels||[]).includes(activeLabel);switch(currentFolder){case'Inbox':return m.folder==='inbox'&&!m.snoozedUntil;case'Starred':return m.starred&&m.folder!=='trash'&&m.folder!=='spam';case'Snoozed':return !!m.snoozedUntil&&m.folder!=='trash';case'Sent':return m.folder==='sent';case'Archive':return m.folder==='archive';case'Spam':return m.folder==='spam';case'Trash':return m.folder==='trash';case'Drafts':return m.folder==='draft';default:return m.folder==='inbox'&&!m.snoozedUntil}});arr.sort((a,b)=>(sortNewest?b.time-a.time:a.time-b.time));return arr}
function render(){const title=activeLabel||currentFolder;$('#folderTitle').textContent=title;$('#folderSubtitle').textContent=query?`Search results for “${query}”`:activeLabel?`Messages labeled ${activeLabel}`:'A little room to think.';$('#unreadCount').textContent=messages.filter(m=>m.folder==='inbox'&&m.unread&&!m.snoozedUntil).length||'';$('#draftCount').textContent=messages.filter(m=>m.folder==='draft').length||'';$('#labels').innerHTML=labels.map(l=>`<button class="label-link" data-label="${esc(l)}"><i class="label-color"></i><span>${esc(l)}</span></button>`).join('');document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',!activeLabel&&b.dataset.folder===currentFolder));$('#selectedCount').textContent=selected.size?`${selected.size} selected`:'';const arr=visibleMessages();$('#selectAll').checked=arr.length>0&&arr.every(m=>selected.has(m.id));if(openedId){const m=messages.find(x=>x.id===openedId);if(m){renderReader(m);return}openedId=null}reader.hidden=true;list.hidden=false;if(!arr.length){list.innerHTML=`<div class="empty"><div class="empty-emoji">${query?'⌕':'✧'}</div><h2>${query?'No matches found':'Nothing here for now'}</h2><div>${query?'Try another search.':'You’re all caught up. Enjoy the quiet.'}</div></div>`;return}list.innerHTML=arr.map(m=>`<article class="mail-card ${m.unread?'unread':''}" data-id="${esc(m.id)}"><input class="mail-check row-check" type="checkbox" aria-label="Select message" ${selected.has(m.id)?'checked':''}><button class="star-btn ${m.starred?'on':''}" data-action="star" title="${m.starred?'Unstar':'Star'}" aria-label="${m.starred?'Unstar':'Star'} message">${m.starred?'★':'☆'}</button><div class="person" style="background:${color(m.sender)}">${esc(initials(m.sender))}</div><div class="mail-sender" data-action="open">${esc(m.sender)}</div><div class="mail-subject" data-action="open">${esc(m.subject||'(No subject)')} <span class="mail-preview">— ${esc(m.preview||'')}</span></div><div class="mail-date">${dateLabel(m.time)}</div></article>`).join('')}
function renderReader(m){list.hidden=true;reader.hidden=false;reader.innerHTML=`<div class="reader-top"><button class="small-btn" data-action="back" title="Back to list" aria-label="Back">←</button><button class="small-btn" data-action="archive" title="Archive" aria-label="Archive">▤</button><button class="small-btn" data-action="trash" title="Delete" aria-label="Delete">♲</button><button class="small-btn" data-action="spam" title="Report spam" aria-label="Report spam">!</button><span class="head-spacer"></span><button class="small-btn" data-action="star" title="Star" aria-label="Star">${m.starred?'★':'☆'}</button></div><h2>${esc(m.subject||'(No subject)')}</h2><div class="reader-meta"><div class="person" style="background:${color(m.sender)}">${esc(initials(m.sender))}</div><div><strong>${esc(m.sender)} <span style="font-weight:400;color:var(--muted)">&lt;${esc(m.email||'')}&gt;</span></strong><small>${new Date(m.time).toLocaleString()}${m.to?` · to ${esc(m.to)}`:''}</small></div></div><div class="reader-content">${esc(m.body||m.preview||'')}</div><div class="reader-actions"><button class="pill" data-action="reply">↶ Reply</button><button class="pill" data-action="forward">↗ Forward</button></div>`}
function showFolder(folder){currentFolder=folder;activeLabel='';openedId=null;selected.clear();render()}
function moveMessage(m,folder){m.folder=folder;delete m.snoozedUntil;if(folder==='trash'||folder==='spam')m.starred=false}
function act(type,m){if(!m)return;if(type==='star')m.starred=!m.starred;else if(type==='read')m.unread=!m.unread;else if(type==='archive')moveMessage(m,'archive');else if(type==='trash')moveMessage(m,'trash');else if(type==='spam')moveMessage(m,'spam');else if(type==='restore'){m.folder='inbox';delete m.snoozedUntil}else if(type==='snooze'){m.snoozedUntil=Date.now()+86400000;m.folder='inbox'}save();if(type==='archive'||type==='trash'||type==='spam'||type==='restore')openedId=null;render();toast(({star:m.starred?'Star added':'Star removed',read:m.unread?'Marked unread':'Marked read',archive:'Moved to archive',trash:'Moved to trash',spam:'Reported as spam',restore:'Restored to inbox',snooze:'Snoozed until tomorrow'})[type]||'Updated')}
function openComposer(draft=null,mode='new',source=null){editingDraft=draft?.id||null;$('#toField').value=mode==='reply'&&source?source.email||'':draft?.to||'';$('#subjectField').value=mode==='reply'&&source?'Re: '+source.subject:draft?.subject|| (mode==='forward'&&source?'Fwd: '+source.subject:'');$('#bodyField').value=draft?.body|| (mode==='reply'&&source?`\n\n— On ${new Date(source.time).toLocaleString()}, ${source.sender} wrote —\n${source.body||''}`:mode==='forward'&&source?`\n\n---------- Forwarded message ----------\nFrom: ${source.sender}\nSubject: ${source.subject}\n\n${source.body||''}`:'');$('#attachmentNames').textContent='';composer.classList.add('open');setTimeout(()=>$('#toField').focus(),30)}
function closeComposer(){if(composer.classList.contains('open')){saveDraft();composer.classList.remove('open')}}
function saveDraft(){const to=$('#toField').value.trim(),subject=$('#subjectField').value.trim(),body=$('#bodyField').value;if(!to&&!subject&&!body){if(editingDraft)messages=messages.filter(m=>m.id!==editingDraft);editingDraft=null;save();return}let d=messages.find(m=>m.id===editingDraft);if(!d){d={id:id(),sender:'Draft',email:'',time:Date.now(),unread:false,starred:false,folder:'draft',labels:[]};messages.unshift(d);editingDraft=d.id}Object.assign(d,{to,subject,body,preview:body.slice(0,100),time:Date.now(),folder:'draft'});save()}
function sendMessage(){const to=$('#toField').value.trim(),subject=$('#subjectField').value.trim(),body=$('#bodyField').value.trim();if(!to){$('#toField').focus();toast('Add a recipient first');return}if(!/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(to.split(/[,;]/)[0])){toast('Enter a valid email address');$('#toField').focus();return}const old=messages.find(m=>m.id===editingDraft);if(old)messages=messages.filter(m=>m.id!==old.id);messages.unshift({id:id(),sender:'You',email:'you@themailer.local',to,subject:subject||'(No subject)',preview:body.slice(0,100),body,time:Date.now(),unread:false,starred:false,folder:'sent',labels:[]});editingDraft=null;composer.classList.remove('open');$('#toField').value='';$('#subjectField').value='';$('#bodyField').value='';save();render();toast('Saved to Sent. This demo does not deliver email.')}
function bulk(type){const targets=messages.filter(m=>selected.has(m.id));if(!targets.length){toast('Select at least one message');return}if(type==='label'){const name=prompt('Label name to apply:');if(!name)return;if(!labels.includes(name)){labels.push(name)}targets.forEach(m=>{m.labels=m.labels||[];if(!m.labels.includes(name))m.labels.push(name)});save();render();toast(`Label “${name}” applied`);return}targets.forEach(m=>{if(type==='read')m.unread=false;else if(type==='archive')moveMessage(m,'archive');else if(type==='trash')moveMessage(m,'trash');else if(type==='spam')moveMessage(m,'spam');else if(type==='snooze'){m.snoozedUntil=Date.now()+86400000;m.folder='inbox'}});selected.clear();save();render();toast(`${targets.length} message${targets.length===1?'':'s'} updated`)}
function modal(title,content,buttons=[{text:'Close',action:'close'}]){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><h2>${esc(title)}</h2>${content}<div class="modal-actions">${buttons.map((b,i)=>`<button class="pill" data-modal-action="${i}">${esc(b.text)}</button>`).join('')}</div></div></div>`;root.querySelector('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))root.innerHTML=''};root.querySelectorAll('[data-modal-action]').forEach((el,i)=>el.onclick=()=>{const result=buttons[i].run?.();if(result!==false)root.innerHTML=''})}
$('#composeBtn').onclick=()=>openComposer();$('#closeCompose').onclick=closeComposer;$('#discardBtn').onclick=()=>{if(editingDraft)messages=messages.filter(m=>m.id!==editingDraft);editingDraft=null;composer.classList.remove('open');$('#toField').value='';$('#subjectField').value='';$('#bodyField').value='';save();render();toast('Draft discarded')};$('#sendBtn').onclick=sendMessage;$('#toField').addEventListener('input',()=>{clearTimeout(saveTimer);saveTimer=setTimeout(saveDraft,700)});$('#subjectField').addEventListener('input',()=>{clearTimeout(saveTimer);saveTimer=setTimeout(saveDraft,700)});$('#bodyField').addEventListener('input',()=>{clearTimeout(saveTimer);saveTimer=setTimeout(saveDraft,700)});
$('#attachBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>{$('#attachmentNames').textContent=[...e.target.files].map(f=>`${f.name} (${Math.ceil(f.size/1024)} KB)`).join(' · ')||'';toast('Attachments are shown locally only; they are not uploaded.')};$('#emojiBtn').onclick=()=>{const t=$('#bodyField');t.setRangeText('🙂',t.selectionStart,t.selectionEnd,'end');t.focus();t.dispatchEvent(new Event('input'))};
document.querySelector('.nav').onclick=e=>{const b=e.target.closest('[data-folder]');if(b)showFolder(b.dataset.folder)};$('#labels').onclick=e=>{const b=e.target.closest('[data-label]');if(!b)return;activeLabel=b.dataset.label;openedId=null;selected.clear();render()};$('#addLabel').onclick=()=>{const name=prompt('Name your new label:');if(!name?.trim())return;if(labels.includes(name.trim())){toast('That label already exists');return}labels.push(name.trim());save();render();toast('Label created')};$('#search').oninput=e=>{query=e.target.value.trim();openedId=null;selected.clear();render()};$('#clearSearch').onclick=()=>{$('#search').value='';query='';render();$('#search').focus()};$('#refreshBtn').onclick=()=>{messages=loadMessages();render();toast('Mailbox refreshed')};$('#sortBtn').onclick=()=>{sortNewest=!sortNewest;render();toast(sortNewest?'Newest messages first':'Oldest messages first')};$('#themeBtn').onclick=()=>{dark=!dark;document.body.classList.toggle('dark',dark);save();toast(dark?'Dark theme on':'Light theme on')};$('#helpBtn').onclick=()=>modal('Welcome to The Mailer','<p>This is a private, local-first email interface demo. Your mailbox is saved in this browser using local storage.</p><p>Search your mail, use the folders and labels, star important messages, select several for bulk actions, and compose drafts.</p><p><strong>Sending:</strong> Messages are saved in Sent on this device. A mail server is required to deliver real email.</p>');$('#accountBtn').onclick=()=>modal('Your account','<p><strong>You</strong><br>you@themailer.local</p><p>This demo does not have sign-in or a remote account. Your data stays in this browser profile.</p>',[{text:'Clear local mailbox',run:()=>{if(confirm('Permanently clear all The Mailer data in this browser?')){messages=[];labels=[];save();showFolder('Inbox');toast('Local mailbox cleared')}return true}},{text:'Close'}]);$('#selectAll').onchange=e=>{visibleMessages().forEach(m=>e.target.checked?selected.add(m.id):selected.delete(m.id));render()};document.querySelector('.toolbar').onclick=e=>{const b=e.target.closest('[data-bulk]');if(b)bulk(b.dataset.bulk)};
list.onclick=e=>{const card=e.target.closest('.mail-card');if(!card)return;const m=messages.find(x=>x.id===card.dataset.id);if(!m)return;if(e.target.matches('.row-check')){e.target.checked?selected.add(m.id):selected.delete(m.id);render();return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='star'){act('star',m);return}if(action==='open'){m.unread=false;openedId=m.id;save();render();return}if(e.target.closest('.mail-subject,.mail-sender')){m.unread=false;openedId=m.id;save();render()}};
reader.onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const m=messages.find(x=>x.id===openedId);if(b.dataset.action==='back'){openedId=null;render();return}if(b.dataset.action==='reply'||b.dataset.action==='forward'){openComposer(null,b.dataset.action,m);return}act(b.dataset.action,m)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(composer.classList.contains('open'))closeComposer();if($('#modalRoot').innerHTML)$('#modalRoot').innerHTML=''}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}});
render();
})();
</script>
</body>
</html>
